<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telemetry Dashboard — XLSX & CSV</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* ─── ROOT ─── */
        :root {
            --bg: #07090f;
            --surf: #0e1420;
            --surf2: #141d2e;
            --border: #1c2c44;
            --border2: #243550;
            --text: #ccd6e8;
            --muted: #4e6685;
            --accent: #00d4a8;
            --blue: #3b91f7;
            --amber: #f5a623;
            --red: #f04060;
            --purple: #a37af4;
            --lap-color: #f0c050;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* Mengizinkan scroll ke bawah */
        html, body {
            min-height: 100vh; 
            overflow-x: hidden;
            background: var(--bg); color: var(--text);
            font: 12px/1.5 'Inter', system-ui, sans-serif;
        }

        /* ─── APP FLEX LAYOUT ─── */
        #app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        #app.hide-chart #charts { display: none !important; }

        /* ─── HEADER ─── */
        #hdr {
            flex: 0 0 44px; 
            background: var(--surf); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px; padding: 0 12px;
            flex-wrap: nowrap; overflow: hidden;
        }
        #hdr-logo { font-size: 14px; font-weight: 800; color: var(--accent); white-space: nowrap; }
        #hdr-logo span { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 4px; }
        #hdr-status { font-size: 11px; color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .hdr-btn {
            background: var(--accent); color: #000; border: none; padding: 4px 14px;
            border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
        }
        .hdr-btn:hover { opacity: .85; }
        #btn-export { background: var(--blue); color: #fff; display: none; }
        #btn-export:hover { background: #2679d9; }
        #hdr-pts { font-size: 10px; color: var(--border2); font-variant-numeric: tabular-nums; white-space: nowrap; }
        .hdr-badge { background: var(--surf2); border: 1px solid var(--border); border-radius: 3px; padding: 2px 8px; font-size: 9px; color: var(--muted); white-space: nowrap; }

        /* ─── MIDDLE ─── */
        #mid { 
            flex: 0 0 45vh; 
            min-height: 380px; 
            display: grid; grid-template-columns: 25% 1fr; overflow: hidden; 
        }

        /* ─── MAP ─── */
        #map-wrap { position: relative; border-right: 1px solid var(--border); }
        #map { width: 100%; height: 100%; }
        .leaflet-container { background: #0a0f1a; }

        #map-ctrl { position: absolute; top: 8px; right: 8px; z-index: 500; display: flex; flex-direction: column; gap: 5px; }
        .m-btn {
            background: rgba(14, 20, 32, .92); border: 1px solid var(--border2); color: var(--text);
            font-size: 10px; padding: 4px 9px; border-radius: 4px; cursor: pointer; backdrop-filter: blur(4px);
        }
        .m-btn.on { background: var(--accent); color: #000; border-color: var(--accent); }
        
        #leg {
            position: absolute; bottom: 8px; left: 8px; z-index: 500;
            background: rgba(14, 20, 32, .9); border: 1px solid var(--border); border-radius: 6px;
            padding: 5px 8px; backdrop-filter: blur(4px);
        }
        .leg-title { font-size: 8px; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
        .leg-bar { height: 6px; width: 100px; border-radius: 3px; background: linear-gradient(to right, #22c55e, #84cc16, #eab308, #f97316, #ef4444); }
        .leg-labels { display: flex; justify-content: space-between; font-size: 8px; color: var(--muted); margin-top: 2px; }

        #map-empty { position: absolute; inset: 0; z-index: 400; display: flex; align-items: center; justify-content: center; pointer-events: none; }
        #map-empty-box { background: rgba(7, 9, 15, .85); border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; text-align: center; }

        /* ─── SIDEBAR ─── */
        #side {
            background: var(--surf2); padding: 12px 16px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 14px;
        }
        
        /* Layout untuk Mode Single (Bawaan) */
        #side-single-view { display: flex; flex-direction: column; gap: 14px; }
        
        /* Layout untuk Mode Compare (Terbelah 2) */
        #side-compare-view { display: none; grid-template-columns: 1fr 1fr; gap: 16px; align-items: flex-start; }
        .cmp-lap-wrap { background: var(--surf); border: 1px solid var(--border); border-radius: 6px; padding: 14px; }
        .cmp-lap-title { font-size: 14px; font-weight: 800; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 12px; }

        .stats-main {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 12px; border-bottom: 1px solid var(--border); padding-bottom: 14px;
        }
        .stat { display: flex; flex-direction: column; gap: 2px; }
        .stat-lbl { font-size: 9px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
        .stat-row { display: flex; align-items: baseline; gap: 4px; }
        .stat-val { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
        .stat-unit { font-size: 10px; color: var(--muted); }
        
        .tbar-wrap { height: 4px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 4px; width: 80%; }
        .tbar-fill { height: 100%; border-radius: 3px; transition: width .08s, background .08s; width: 0%; }

        /* Re-usable Lap Info Grid */
        .lap-info-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px;
        }
        .lap-info-grid .row { display: flex; flex-direction: column; gap: 3px; }
        .lap-info-grid .row span { font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
        .lap-info-grid .row strong { font-size: 13px; color: var(--text); }
        .lap-info-grid .highlight { color: var(--lap-color); font-weight: 700; }

        .phase-list {
            grid-column: 1 / -1; margin-top: 10px; padding-top: 12px;
            border-top: 1px dashed var(--border);
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
        }
        .phase-col { display: flex; flex-direction: column; gap: 8px; }
        .phase-header { font-size: 10px; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 4px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        .phase-card { background: rgba(14,20,32,0.6); border: 1px solid var(--border); padding: 8px 10px; border-radius: 4px; }
        .phase-card-title { font-size: 11px; font-weight: 800; margin-bottom: 6px; }
        .phase-card-body { font-size: 11px; color: var(--muted); display: grid; gap: 4px; }
        .phase-card-body span { display: flex; justify-content: space-between; }
        .phase-card-body span strong { font-weight: 600; color: var(--text); font-family: monospace; font-size: 12px; }

        /* ─── REPLAY BAR ─── */
        #rbar { 
            flex: 0 0 auto;
            background: var(--surf); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); 
            display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; 
        }
        .rbar-top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
        .rbar-grp { display: flex; align-items: center; gap: 6px; background: var(--surf2); border: 1px solid var(--border); padding: 5px 10px; border-radius: 6px; }
        .rbar-grp.no-bg { background: transparent; border: none; padding: 0; }
        .ctrl-lbl { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-right: 2px; }
        .c-btn { background: var(--surf2); border: 1px solid var(--border); color: var(--text); width: 30px; height: 30px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .c-btn:hover { border-color: var(--accent); color: var(--accent); }
        .c-btn.playing { background: var(--accent); color: #000; border-color: var(--accent); }
        .ln-btn { background: var(--surf2); border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: 4px 10px; font-size: 11px; cursor: pointer; font-weight: 600; }
        .ln-btn:hover { border-color: var(--lap-color); color: var(--lap-color); }
        #lap-sel, #spd-sel { background: var(--surf); border: 1px solid var(--border); color: var(--text); padding: 4px 6px; border-radius: 4px; font-size: 11px; outline: none;}
        #btn-toggle-chart { background: var(--accent); color: #000; padding: 5px 12px; margin-left: auto; border: none;}
        #app.hide-chart #btn-toggle-chart { background: var(--surf2); color: var(--text); border: 1px solid var(--border); }
        #app.hide-chart #btn-toggle-chart:hover { border-color: var(--accent); color: var(--accent); }
        .rbar-bottom { width: 100%; display: flex; align-items: center; padding: 4px 0; }
        #slider { width: 100%; height: 6px; cursor: pointer; accent-color: var(--accent); background: var(--border2); border-radius: 3px; outline: none; -webkit-appearance: none; }
        #slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer;}

        /* ─── CHARTS ─── */
        #charts { 
            flex: 0 0 auto; 
            display: flex; flex-direction: column; 
            padding-bottom: 20px;
        }
        #ch-tabs { display: flex; gap: 2px; padding: 6px 12px 0; border-bottom: 1px solid var(--border); background: var(--surf); flex-shrink: 0; }
        .ch-tab { font-size: 10px; font-weight: 600; padding: 5px 14px; border-radius: 6px 6px 0 0; cursor: pointer; border: 1px solid transparent; color: var(--muted); }
        .ch-tab.on { background: var(--bg); border-color: var(--border) var(--border) var(--bg); color: var(--text); margin-bottom: -1px; }
        .ch-tab:hover:not(.on) { color: var(--accent); }
        
        #cmp-ctrl { display: none; padding: 8px 12px; background: var(--surf); border-bottom: 1px solid var(--border); gap: 10px; align-items: center; }
        #cmp-ctrl select { background: var(--surf2); color: var(--text); border: 1px solid var(--border); border-radius: 4px; font-size: 11px; padding: 3px 6px; outline: none; font-weight: 600;}
        #cmp-a { color: #00d4a8 !important; }
        #cmp-b { color: #007a61 !important; }

        #ch-area { padding: 12px; position: relative; display: flex; flex-direction: column; }
        
        /* Container grafik dengan tinggi diperbesar menjadi 200px */
        #ch-single { width: 100%; height: 200px; position: relative; display: block; }
        #ch-compare { width: 100%; display: none; flex-direction: column; gap: 16px; }
        .ch-cmp-box { height: 200px; position: relative; border: 1px solid var(--border); border-radius: 6px; background: var(--surf); padding: 8px; }
        
        #ch-area canvas { width: 100% !important; height: 100% !important; }
        
        #ch-notice { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; flex-direction: column; gap: 6px; z-index: 10; background: var(--bg); }
        #ch-notice.show { display: flex; }
        #ch-notice p { font-size: 11px; color: var(--muted); }
        #ch-notice strong { color: var(--text); font-size: 12px; }

        /* ─── UPLOAD OVERLAY ─── */
        #ovl { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, .8); z-index: 3000; align-items: center; justify-content: center; }
        #ovl.show { display: flex; }
        #up-box { background: var(--surf2); border: 2px dashed var(--border2); border-radius: 12px; padding: 24px 32px; text-align: center; width: 340px; }
        #up-box h2 { font-size: 15px; margin-bottom: 6px; }
        #up-box p { font-size: 11px; color: var(--muted); margin-bottom: 14px; line-height: 1.6; }
        .up-choose { background: var(--accent); color: #000; border: none; padding: 8px 16px; border-radius: 5px; font-size: 12px; font-weight: 700; cursor: pointer; margin-right: 5px; }
        .up-close { background: var(--surf); color: var(--text); border: 1px solid var(--border); padding: 8px 16px; border-radius: 5px; font-size: 12px; cursor: pointer; }
        .car-dot { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid #fff; background: var(--accent); transition: background .08s; }

        @media(max-width:850px) {
            #mid { grid-template-columns: 1fr; grid-template-rows: 200px 1fr; }
            #side-compare-view { grid-template-columns: 1fr; }
            .phase-list { grid-template-columns: 1fr; }
            #btn-toggle-chart { margin-left: 0; width: 100%; }
            .rbar-top { flex-direction: row; }
            .rbar-grp { flex-wrap: wrap; width: auto; flex-grow: 1; justify-content: center; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="hdr">
            <div id="hdr-logo">Telemetry</div>
            <div id="hdr-status">Upload file .xlsx or .csv to start</div>
            <span class="hdr-badge" id="hdr-lap-badge">Lap: —</span>
            <div id="hdr-pts"></div>
            <button class="hdr-btn" id="btn-upload" onclick="showUpload()">Upload File</button>
            <button class="hdr-btn" id="btn-export" onclick="exportWeb()">Export Data</button>
        </div>

        <div id="mid">
            <div id="map-wrap">
                <div id="map"></div>
                <div id="map-ctrl">
                    <button class="m-btn on" id="btn-thr" onclick="toggleLayer('thr',this)">Throttle</button>
                    <button class="m-btn on" id="btn-route" onclick="toggleLayer('route',this)">Route</button>
                </div>
                <div id="leg">
                    <div class="leg-title">Throttle</div>
                    <div class="leg-bar"></div>
                    <div class="leg-labels"><span>0%</span><span>100%</span></div>
                </div>
                <div id="map-empty">
                    <div id="map-empty-box"><strong>Invalid Data</strong></div>
                </div>
            </div>

            <div id="side">
                <!-- VIEW 1: Single Lap (Default) -->
                <div id="side-single-view">
                    <div class="stats-main">
                        <div class="stat"><div class="stat-lbl">Speed</div><div class="stat-row"><span class="stat-val" id="sv-spd" style="color:var(--accent)">—</span><span class="stat-unit">km/h</span></div></div>
                        <div class="stat"><div class="stat-lbl">Throttle</div><div class="stat-row"><span class="stat-val" id="sv-thr" style="color:var(--amber)">—</span><span class="stat-unit">%</span></div><div class="tbar-wrap"><div class="tbar-fill" id="tbar"></div></div></div>
                        <div class="stat"><div class="stat-lbl">Current</div><div class="stat-row"><span class="stat-val" id="sv-cur" style="color:var(--blue)">—</span><span class="stat-unit">A</span></div></div>
                        <div class="stat"><div class="stat-lbl">Voltage</div><div class="stat-row"><span class="stat-val" id="sv-vlt" style="color:var(--purple)">—</span><span class="stat-unit">V</span></div></div>
                        <div class="stat"><div class="stat-lbl">Power</div><div class="stat-row"><span class="stat-val" id="sv-pwr" style="color:var(--red)">—</span><span class="stat-unit">W</span></div></div>
                        <div class="stat"><div class="stat-lbl">Energy</div><div class="stat-row"><span class="stat-val" id="sv-nrg">—</span><span class="stat-unit">Wh</span></div></div>
                        <div class="stat"><div class="stat-lbl">Distance</div><div class="stat-row"><span class="stat-val" id="sv-dst">—</span><span class="stat-unit">km</span></div></div>
                    </div>

                    <div class="cmp-lap-wrap" style="padding:0; border:none; background:transparent;">
                        <div class="lap-info-grid" id="lap-info-single">
                            <!-- Diisi via JS (sama dengan isi lap-info box) -->
                        </div>
                    </div>
                </div>

                <!-- VIEW 2: Compare Laps Split -->
                <div id="side-compare-view">
                    <div class="cmp-lap-wrap" id="lap-info-a">
                        <!-- Konten A -->
                    </div>
                    <div class="cmp-lap-wrap" id="lap-info-b">
                        <!-- Konten B -->
                    </div>
                </div>
            </div>
        </div>

        <div id="rbar">
            <div class="rbar-top">
                <div class="rbar-grp no-bg">
                    <button class="c-btn" id="btn-play" onclick="togglePlay()" title="Play">▶</button>
                    <button class="c-btn" onclick="resetReplay()" title="Start Over">⏮</button>
                </div>
                
                <div class="rbar-grp">
                    <span class="ctrl-lbl">Select Data:</span>
                    <button class="ln-btn" onclick="prevLap()">◀</button>
                    <select id="lap-sel" onchange="goToLap(+this.value)"><option value="-1">⊗ All Data</option></select>
                    <button class="ln-btn" onclick="nextLap()">▶</button>
                    <button class="ln-btn" onclick="resetLapView()">All Lap</button>
                </div>

                <div class="rbar-grp">
                    <span class="ctrl-lbl">Playback Spedd:</span>
                    <select id="spd-sel" onchange="setSpeed(+this.value)">
                        <option value="1">1×</option><option value="5">5×</option><option value="10" selected>10×</option><option value="50">50×</option>
                    </select>
                </div>

                <div class="rbar-grp no-bg" style="flex-grow: 1; justify-content: flex-end;">
                    <button id="btn-toggle-chart" class="ln-btn" onclick="toggleChartView()">Hide Graph</button>
                </div>
            </div>
            
            <div class="rbar-bottom">
                <input type="range" id="slider" min="0" max="0" value="0" oninput="onSlider(+this.value)" />
            </div>
        </div>

        <div id="charts">
            <div id="ch-tabs">
                <div class="ch-tab on" onclick="setMode('overview',this)">Overview</div>
                <div class="ch-tab" onclick="setMode('electric',this)">Electrical</div>
                <div class="ch-tab" onclick="setMode('compare',this)">Compare Laps</div>
            </div>
            
            <div id="cmp-ctrl">
                <span style="font-size: 10px; color: var(--muted); font-weight: bold; text-transform: uppercase;">Compare:</span>
                <select id="cmp-a" onchange="buildChart()"></select>
                <span style="font-size: 10px; color: var(--muted);">vs</span>
                <select id="cmp-b" onchange="buildChart()"></select>
            </div>
            
            <div id="ch-area">
                <div id="ch-single">
                    <canvas id="ch"></canvas>
                </div>
                <div id="ch-compare">
                    <div class="ch-cmp-box"><canvas id="ch-cmp-speed"></canvas></div>
                    <div class="ch-cmp-box"><canvas id="ch-cmp-cur"></canvas></div>
                    <div class="ch-cmp-box"><canvas id="ch-cmp-thr"></canvas></div>
                </div>
                <div id="ch-notice"><strong>⚠ Invalid / No Lap Data</strong></div>
            </div>
        </div>
    </div>

    <div id="ovl" onclick="if(event.target===this)hideUpload()">
        <div id="up-box" ondragover="event.preventDefault();this.style.borderColor='var(--accent)'" ondragleave="this.style.borderColor='var(--border2)'" ondrop="event.preventDefault();this.style.borderColor='var(--border2)';loadFiles(event.dataTransfer.files)">
            <h2>Upload Data</h2>
            <p>Upload <code>.xlsx</code> or <code>.csv</code><br /></p>
            <input type="file" id="file-in" accept=".xlsx,.csv" style="display:none;" onchange="loadFiles(this.files)" />
            <button class="up-choose" onclick="document.getElementById('file-in').click()">Upload File</button>
            <button class="up-close" onclick="hideUpload()">Close</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <script>
        const state = { telemetry: [], laps: [], currentLapIdx: -1, ridx: 0, playing: false, timer: null, speed: 10, chartMode: 'overview', layerOn: { thr: true, route: true } };
        let map, routeLyr, thrLyrs = [], carMkr, chart, chartCmpSpeed, chartCmpCur, chartCmpThr, sampled = [];

        function initMap() {
            map = L.map('map', { zoomControl: true, preferCanvas: true });
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSMap', maxZoom: 20 }).addTo(map);
            map.setView([-7.9, 112.6], 15);
        }

        function thrColor(t) {
            const p = Math.max(0, Math.min(100, t)) / 100;
            const stops = [[0, [34,197,94]], [0.25, [132,204,22]], [0.5, [234,179,8]], [0.75, [249,115,22]], [1.0, [239,68,68]]];
            for (let i = 0; i < stops.length - 1; i++) {
                const [t0, c0] = stops[i], [t1, c1] = stops[i + 1];
                if (p >= t0 && p <= t1) {
                    const f = (p - t0) / (t1 - t0);
                    return `rgb(${Math.round(c0[0]+(c1[0]-c0[0])*f)},${Math.round(c0[1]+(c1[1]-c0[1])*f)},${Math.round(c0[2]+(c1[2]-c0[2])*f)})`;
                }
            } return '#ef4444';
        }

        function parseDataArray(dataRows) {
            if (!dataRows || !dataRows.length) throw new Error('Data kosong.');
            const firstRow = dataRows[0];
            const isHeader = firstRow.some(c => /^lat$/i.test(c) || /^lng$/i.test(c) || /^speed$/i.test(c));
            let rows = dataRows, mapCol = {};

            if (isHeader) {
                const h = firstRow.map(x => x.toString().trim().toLowerCase().replace(/[^a-z]/g, ''));
                rows = dataRows.slice(1);
                h.forEach((k, i) => {
                    if(k==='lat') mapCol.lat=i; else if(k==='lng'||k==='lon') mapCol.lng=i;
                    else if(k==='speed') mapCol.speed=i; else if(k==='throttle') mapCol.throttle=i;
                    else if(k==='currentma'||k==='current') mapCol.current=i; else if(k==='voltage') mapCol.voltage=i;
                    else if(k==='power') mapCol.power=i; else if(k==='energy') mapCol.energy=i;
                    else if(k==='distance') mapCol.distance=i; else if(k==='millis') mapCol.millis=i;
                });
            } else {
                mapCol = { lat:1, lng:2, speed:3, throttle:5, current:6, voltage:7, power:8, energy:9, distance:10, millis:11 };
            }

            const out = [];
            for (const row of rows) {
                if (!row || row.length < 3) continue;
                const lat = parseFloat(row[mapCol.lat]), lng = parseFloat(row[mapCol.lng]);
                if (!isFinite(lat) || !isFinite(lng) || (Math.abs(lat)<0.5)) continue;
                out.push({
                    lat, lng, 
                    speed: parseFloat(row[mapCol.speed])||0, 
                    throttle: parseInt(row[mapCol.throttle])||0,
                    current: parseFloat(row[mapCol.current])||0, 
                    voltage: parseFloat(row[mapCol.voltage])||0,
                    power: parseFloat(row[mapCol.power])||0, 
                    energy: parseFloat(row[mapCol.energy])||0,
                    rawDistance: parseFloat(row[mapCol.distance])||0,
                    distance: 0, 
                    millis: parseInt(row[mapCol.millis])||0
                });
            } return out;
        }

        function createLapStats(tele, start, end, counter) {
            let throttleEnergy = 0, glideDistance = 0, glideEnergy = 0;
            let sumDist = 0, sumNrg = 0, sumTimeMs = 0;
            let maxSpeed = tele[start] ? tele[start].speed : 0;
            let maxCurrent = tele[start] ? tele[start].current : 0;
            
            let phases = { throttle: [], glide: [] };
            let currentPhase = null; let phaseData = null;

            for (let i = start + 1; i <= end; i++) {
                const curr = tele[i], prev = tele[i - 1];
                let dDist = Math.max(0, curr.distance - prev.distance);
                let dNrg = Math.max(0, curr.energy - prev.energy);
                
                let dTime = curr.millis - prev.millis;
                if (dTime < 0) dTime = curr.millis; 
                if (dTime > 5000) dTime = 0; 
                
                sumTimeMs += dTime;
                sumDist += dDist; 
                sumNrg += dNrg;

                if (curr.speed > maxSpeed) maxSpeed = curr.speed;
                if (curr.current > maxCurrent) maxCurrent = curr.current;

                let isThrottle = curr.throttle > 0 && curr.current >= 0.1;
                let isGlide = curr.throttle === 0 && curr.current < 0.2 && curr.speed > 3;

                if (isThrottle) throttleEnergy += dNrg;
                if (isGlide) { glideDistance += dDist; glideEnergy += dNrg; }

                if (isThrottle) {
                    if (currentPhase !== 'throttle') {
                        if (currentPhase && phaseData) phases[currentPhase].push(phaseData);
                        currentPhase = 'throttle';
                        phaseData = { durationMs: dTime, startDist: prev.distance, endDist: curr.distance, startEnergy: prev.energy, endEnergy: curr.energy };
                    } else { 
                        phaseData.durationMs += dTime; 
                        phaseData.endDist = curr.distance; 
                        phaseData.endEnergy = curr.energy; 
                    }
                } else if (isGlide) {
                    if (currentPhase !== 'glide') {
                        if (currentPhase && phaseData) phases[currentPhase].push(phaseData);
                        currentPhase = 'glide';
                        phaseData = { durationMs: dTime, startDist: prev.distance, endDist: curr.distance };
                    } else { 
                        phaseData.durationMs += dTime; 
                        phaseData.endDist = curr.distance; 
                    }
                } else {
                    if (currentPhase && phaseData) { phases[currentPhase].push(phaseData); currentPhase = null; phaseData = null; }
                }
            }
            if (currentPhase && phaseData) phases[currentPhase].push(phaseData);

            let timeStr = '--';
            if (sumTimeMs > 0) { 
                const s = sumTimeMs / 1000; 
                timeStr = `${Math.floor(s/60)}:${(s%60).toFixed(1).padStart(4,'0')}`; 
            }

            return { lapCounter: counter, lapTime: timeStr, lapEnergy: sumNrg, lapDistance: sumDist, throttleEnergy, glideDistance, glideEnergy, phases, maxSpeed, maxCurrent, startIdx: start, endIdx: end };
        }

        function detectLaps(tele) {
            if (!tele || tele.length < 10) return [];
            const laps = [];
            let lapStart = -1, lapCounter = 1, inLap = false;
            
            for (let i = 0; i < tele.length; i++) {
                const curr = tele[i];
                const isGpsFrozen = i > 0 && curr.lat === tele[i-1].lat && curr.lng === tele[i-1].lng;
                
                const isIdle = curr.speed < 1 && curr.throttle <= 5 && curr.current < 1.0 && !isGpsFrozen;
                const isHardwareReset = i > 0 && (tele[i-1].rawDistance - curr.rawDistance) > 0.5;
                
                if (!inLap) { 
                    if (!isIdle || isHardwareReset) { 
                        let startIdx = i;
                        let targetMs = tele[i].millis - 5000;
                        while(startIdx > 0 && tele[startIdx].millis > targetMs) {
                            if (tele[startIdx].throttle === 0 && tele[startIdx].speed < 1) {
                                break; 
                            }
                            startIdx--;
                        }
                        lapStart = startIdx; 
                        inLap = true; 
                    }
                } else if (inLap) {
                    if (isIdle || isHardwareReset) {
                        const stats = createLapStats(tele, lapStart, i, lapCounter);
                        if (stats.lapDistance > 0.05) { laps.push(stats); lapCounter++; }
                        inLap = false;
                        
                        if (isHardwareReset && !isIdle) { 
                            let startIdx = i;
                            let targetMs = tele[i].millis - 5000;
                            while(startIdx > 0 && tele[startIdx].millis > targetMs) {
                                if (tele[startIdx].throttle === 0 && tele[startIdx].speed < 1) { break; }
                                startIdx--;
                            }
                            lapStart = startIdx; 
                            inLap = true; 
                        }
                    }
                }
            }
            if (inLap && lapStart !== -1) {
                const stats = createLapStats(tele, lapStart, tele.length - 1, lapCounter);
                if (stats.lapDistance > 0.05) { laps.push(stats); }
            } 
            return laps;
        }

        // Pembangun HTML String untuk Kotak Informasi (Digunakan Keduanya)
        function getLapInfoHTML(lap, colorClass) {
            if (!lap) return '<div class="lap-info-grid"><div class="row">Tidak ada data</div></div>';
            const eff = (lap.lapDistance > 0 && lap.lapEnergy > 0) ? (lap.lapDistance / (lap.lapEnergy / 1000)).toFixed(2) : '—';
            
            const txtTitle = lap.lapCounter === 'All' ? 'All Data' : `Lap #${lap.lapCounter}`;
            
            let html = `
                <div class="cmp-lap-title" style="color: ${colorClass || 'var(--accent)'}">${txtTitle} — <span style="color:var(--text);font-weight:600;">${lap.lapTime || '--:--'}</span></div>
                <div class="lap-info-grid">
                    <div class="row"><span>Total Distance</span><strong>${(lap.lapDistance || 0).toFixed(3)} km</strong></div>
                    <div class="row"><span>Total Energy</span><strong>${(lap.lapEnergy || 0).toFixed(2)} Wh</strong></div>
                    <div class="row"><span>Max Speed</span><strong style="color:var(--accent)">${(lap.maxSpeed || 0).toFixed(1)} km/h</strong></div>
                    <div class="row"><span>Max Current</span><strong style="color:var(--red)">${(lap.maxCurrent || 0).toFixed(2)} A</strong></div>
                    <div class="row"><span>Gliding Distance</span><strong style="color:var(--blue)">${(lap.glideDistance || 0).toFixed(3)} km</strong></div>
                    <div class="row"><span>Efficiency</span><strong class="highlight">${eff} km/kWh</strong></div>
                </div>
            `;

            if (lap.phases) {
                let thrHTML = `<div class="phase-col"><div class="phase-header" style="color:var(--amber)">THROTTLING PHASE</div>`;
                let thrCount = 0;
                lap.phases.throttle.forEach(p => {
                    const dDist = Math.max(0, p.endDist - p.startDist);
                    const dNrg = Math.max(0, p.endEnergy - p.startEnergy);
                    const dTime = p.durationMs / 1000;
                    if (dDist < 0.001 && dTime < 0.5) return; 
                    thrCount++;
                    thrHTML += `<div class="phase-card"><div class="phase-card-title" style="color:var(--amber)">THROTTLE ${thrCount}</div>
                        <div class="phase-card-body"><span>Energy: <strong>${dNrg.toFixed(4)} Wh</strong></span>
                        <span>Time: <strong>${dTime.toFixed(1)} s</strong></span><span>Dist: <strong>${(dDist * 1000).toFixed(1)} m</strong></span></div></div>`;
                }); thrHTML += '</div>';

                let gldHTML = `<div class="phase-col"><div class="phase-header" style="color:var(--blue)">GLIDING PHASE</div>`;
                let gldCount = 0;
                lap.phases.glide.forEach(p => {
                    const dDist = Math.max(0, p.endDist - p.startDist);
                    const dTime = p.durationMs / 1000;
                    if (dDist < 0.001 && dTime < 0.5) return;
                    gldCount++;
                    gldHTML += `<div class="phase-card"><div class="phase-card-title" style="color:var(--blue)">GLIDING ${gldCount}</div>
                        <div class="phase-card-body"><span>Time: <strong>${dTime.toFixed(1)} s</strong></span>
                        <span>Dist: <strong>${(dDist * 1000).toFixed(1)} m</strong></span></div></div>`;
                }); gldHTML += '</div>';

                html += `<div class="phase-list">`;
                html += (thrCount ? thrHTML : `<div class="phase-col"><div class="phase-header" style="color:var(--amber)">THROTTLING</div><div class="phase-card-body">Tidak ada data</div></div>`);
                html += (gldCount ? gldHTML : `<div class="phase-col"><div class="phase-header" style="color:var(--blue)">GLIDING</div><div class="phase-card-body">Tidak ada data</div></div>`);
                html += `</div>`;
            }
            return html;
        }

        function buildMapLayers() {
            thrLyrs.forEach(l => map.removeLayer(l)); thrLyrs = [];
            if (routeLyr) { map.removeLayer(routeLyr); routeLyr = null; }
            if (carMkr) { map.removeLayer(carMkr); carMkr = null; }

            const data = getVisibleData();
            if (!data.length) { document.getElementById('map-empty').style.display = 'flex'; return; }
            document.getElementById('map-empty').style.display = 'none';

            const coords = data.map(d => [d.lat, d.lng]);
            if (state.layerOn.route) routeLyr = L.polyline(coords, { color: '#1a3050', weight: 5, opacity: .6 }).addTo(map);
            if (state.layerOn.thr) {
                let segPts = [[data[0].lat, data[0].lng]], segBucket = Math.floor(data[0].throttle / 5);
                const flush = () => {
                    if (segPts.length < 2) return;
                    thrLyrs.push(L.polyline(segPts, { color: thrColor(segBucket * 5), weight: 4, opacity: .92, lineCap: 'round', lineJoin: 'round' }).addTo(map));
                };
                for (let i = 1; i < data.length; i++) {
                    const bucket = Math.floor(data[i].throttle / 5);
                    if (bucket !== segBucket) {
                        segPts.push([data[i].lat, data[i].lng]); flush();
                        segPts = [[data[i - 1].lat, data[i - 1].lng], [data[i].lat, data[i].lng]];
                        segBucket = bucket;
                    } else { segPts.push([data[i].lat, data[i].lng]); }
                } flush();
            }
            carMkr = L.marker(coords[0], { icon: L.divIcon({ className: '', html: '<div class="car-dot" id="car-dot"></div>', iconSize: [14, 14], iconAnchor: [7, 7] }), zIndexOffset: 2000 }).addTo(map);
            map.fitBounds(L.latLngBounds(coords).pad(.08));
        }

        function getVisibleData() {
            if (!state.telemetry.length) return [];
            if (state.currentLapIdx < 0 || !state.laps[state.currentLapIdx]) return state.telemetry;
            return state.telemetry.slice(state.laps[state.currentLapIdx].startIdx, state.laps[state.currentLapIdx].endIdx + 1);
        }

        function seekTo(i) {
            const data = state.telemetry;
            if (!data.length) return;
            state.ridx = Math.max(0, Math.min(i, data.length - 1));
            const d = data[state.ridx];

            if (carMkr) carMkr.setLatLng([d.lat, d.lng]);
            const dot = document.getElementById('car-dot');
            if (dot) { const c = thrColor(d.throttle); dot.style.background = c; dot.style.boxShadow = `0 0 10px ${c}`; }

            $('sv-spd', d.speed.toFixed(2)); $('sv-thr', d.throttle); $('sv-cur', d.current.toFixed(2)); 
            $('sv-vlt', d.voltage.toFixed(1)); $('sv-pwr', d.power.toFixed(1));
            $('sv-nrg', d.energy.toFixed(4)); $('sv-dst', d.distance.toFixed(3));

            const bar = document.getElementById('tbar');
            bar.style.width = d.throttle + '%'; bar.style.background = thrColor(d.throttle);
            document.getElementById('slider').value = state.ridx;

            updateLapInfo();
            if (chart && state.chartMode !== 'compare') chart.update('none');
        }

        function $(id, v) { const e = document.getElementById(id); if (e) e.textContent = v; }

        function updateLapInfo() {
            let lap = (state.currentLapIdx >= 0 && state.laps[state.currentLapIdx]) ? state.laps[state.currentLapIdx] : null;
            if (!lap && state.telemetry.length) lap = createLapStats(state.telemetry, 0, state.telemetry.length - 1, 'All');
            
            document.getElementById('lap-info-single').innerHTML = getLapInfoHTML(lap, 'var(--accent)');
        }

        function updateLapSelector() {
            const sel = document.getElementById('lap-sel'); sel.innerHTML = '<option value="-1">⊗ All Data</option>';
            const cmpA = document.getElementById('cmp-a'); cmpA.innerHTML = '';
            const cmpB = document.getElementById('cmp-b'); cmpB.innerHTML = '';
            
            state.laps.forEach((l, i) => {
                const txt = `Lap #${l.lapCounter} (${l.lapTime})`;
                sel.appendChild(new Option(txt, i));
                cmpA.appendChild(new Option(txt, i));
                cmpB.appendChild(new Option(txt, i));
            });
            sel.value = state.currentLapIdx;
            
            if(state.laps.length > 0) cmpA.value = 0;
            if(state.laps.length > 1) cmpB.value = 1;
            else if (state.laps.length > 0) cmpB.value = 0;
        }

        function goToLap(idx) {
            if (idx < -1 || idx >= state.laps.length) return;
            state.currentLapIdx = idx;
            if (state.playing) togglePlay();
            buildMapLayers(); buildChart();
            document.getElementById('slider').max = Math.max(0, state.telemetry.length - 1);
            seekTo((idx >= 0 && state.laps[idx]) ? Math.min(state.laps[idx].startIdx, state.telemetry.length - 1) : 0);
            updateLapSelector(); updateLapInfo();
        }

        function togglePlay() {
            if (state.playing) { state.playing = false; clearInterval(state.timer); document.getElementById('btn-play').textContent = '▶'; return; }
            const b = state.currentLapIdx >= 0 ? state.laps[state.currentLapIdx].startIdx : 0;
            if (state.ridx >= state.telemetry.length - 1 || state.ridx < b) state.ridx = b;
            state.playing = true; document.getElementById('btn-play').textContent = '⏸';
            const step = Math.max(1, Math.round(state.speed * Math.max(16, Math.round(80 / state.speed)) / 100));
            state.timer = setInterval(() => {
                const next = state.ridx + step, end = state.currentLapIdx >= 0 ? state.laps[state.currentLapIdx].endIdx : state.telemetry.length - 1;
                if (next >= end) { togglePlay(); seekTo(end); return; } seekTo(next);
            }, Math.max(16, Math.round(80 / state.speed)));
        }

        function resetReplay() { if(state.playing) togglePlay(); seekTo(state.currentLapIdx >= 0 ? state.laps[state.currentLapIdx].startIdx : 0); }
        function setSpeed(v) { state.speed = v; if (state.playing) { togglePlay(); togglePlay(); } }
        function onSlider(v) { if (state.playing) togglePlay(); seekTo(v); }
        function toggleLayer(k, b) { state.layerOn[k] = !state.layerOn[k]; b.classList.toggle('on', state.layerOn[k]); buildMapLayers(); seekTo(state.ridx); }
        function showUpload() { document.getElementById('ovl').classList.add('show'); }
        function hideUpload() { document.getElementById('ovl').classList.remove('show'); }

        function toggleChartView() {
            const app = document.getElementById('app');
            const btn = document.getElementById('btn-toggle-chart');
            app.classList.toggle('hide-chart');
            
            if (app.classList.contains('hide-chart')) {
                btn.innerHTML = '📊 Tampilkan Grafik';
            } else {
                btn.innerHTML = '📊 Sembunyikan Grafik';
            }
            setTimeout(() => { if (map) map.invalidateSize(); }, 350);
        }

        function setMode(m, el) { 
            state.chartMode = m; 
            document.querySelectorAll('.ch-tab').forEach(t => t.classList.remove('on')); 
            el.classList.add('on'); 
            
            const cmpCtrl = document.getElementById('cmp-ctrl');
            const chSingle = document.getElementById('ch-single');
            const chCompare = document.getElementById('ch-compare');
            
            const sideSingle = document.getElementById('side-single-view');
            const sideCompare = document.getElementById('side-compare-view');

            if (m === 'compare') {
                cmpCtrl.style.display = 'flex';
                chSingle.style.display = 'none';
                chCompare.style.display = 'flex';
                
                sideSingle.style.display = 'none';
                sideCompare.style.display = 'grid';
            } else {
                cmpCtrl.style.display = 'none';
                chSingle.style.display = 'block';
                chCompare.style.display = 'none';
                
                sideSingle.style.display = 'flex';
                sideCompare.style.display = 'none';
            }
            
            buildChart(); 
        }

        // Pembangun Grafik Khusus Compare 3 Vertikal
        function renderCompareChart(canvasId, title, yTitle, sets) {
            const scl = { 
                x: { type: 'linear', ticks: { color: '#2a4060', font: {size: 9} }, grid: { color: '#0d1620' }, title: { display: true, text: 'Distance (km)', color: '#4e6685', font: {size: 10} } }, 
                yL: { type: 'linear', position: 'left', ticks: {color: '#2a4060', font: {size: 9}}, grid: {color: '#0d1620'}, title: { display: true, text: yTitle, color: '#4e6685', font: {size: 10} } }
            };
            
            return new Chart(document.getElementById(canvasId), {
                type: 'line', data: { datasets: sets },
                options: { 
                    animation: false, responsive: true, maintainAspectRatio: false, 
                    interaction: { mode: 'index', intersect: false }, 
                    plugins: { 
                        title: { display: true, text: title, color: '#ccd6e8', font: {size: 11}, padding: {top: 2, bottom: 2} },
                        legend: { labels: { color: '#4e6685', font: { size: 9 }, boxWidth: 12 }, position: 'top' } 
                    }, 
                    scales: scl 
                }
            });
        }

        function buildChart() {
            const cvs = document.getElementById('ch'), ntc = document.getElementById('ch-notice');
            ntc.classList.remove('show'); 
            
            if (chart) { chart.destroy(); chart = null; }
            if (chartCmpSpeed) { chartCmpSpeed.destroy(); chartCmpSpeed = null; }
            if (chartCmpCur) { chartCmpCur.destroy(); chartCmpCur = null; }
            if (chartCmpThr) { chartCmpThr.destroy(); chartCmpThr = null; }

            const m = state.chartMode;

            // KONDISI TAB COMPARE 
            if (m === 'compare') {
                const idxA = parseInt(document.getElementById('cmp-a').value);
                const idxB = parseInt(document.getElementById('cmp-b').value);
                
                if (isNaN(idxA) || isNaN(idxB) || !state.laps[idxA] || !state.laps[idxB]) {
                    ntc.classList.add('show'); return;
                }
                
                const lapA = state.laps[idxA];
                const lapB = state.laps[idxB];
                
                const dataA = state.telemetry.slice(lapA.startIdx, lapA.endIdx + 1);
                const dataB = state.telemetry.slice(lapB.startIdx, lapB.endIdx + 1);
                
                const stepA = Math.max(1, Math.floor(dataA.length / 1000));
                const stepB = Math.max(1, Math.floor(dataB.length / 1000));
                
                const dStartA = dataA[0].distance;
                const dStartB = dataB[0].distance;

                // Membangun Grafik Komparasi Berpasangan (Sumbu X adalah Jarak)
                const ptsSpeedA = dataA.filter((_,i)=>i%stepA===0).map(d => ({x: d.distance - dStartA, y: d.speed}));
                const ptsCurA = dataA.filter((_,i)=>i%stepA===0).map(d => ({x: d.distance - dStartA, y: d.current}));
                const ptsThrA = dataA.filter((_,i)=>i%stepA===0).map(d => ({x: d.distance - dStartA, y: d.throttle}));

                const ptsSpeedB = dataB.filter((_,i)=>i%stepB===0).map(d => ({x: d.distance - dStartB, y: d.speed}));
                const ptsCurB = dataB.filter((_,i)=>i%stepB===0).map(d => ({x: d.distance - dStartB, y: d.current}));
                const ptsThrB = dataB.filter((_,i)=>i%stepB===0).map(d => ({x: d.distance - dStartB, y: d.throttle}));

                chartCmpSpeed = renderCompareChart('ch-cmp-speed', 'SPEED COMPARISON', 'Speed (km/h)', [
                    { label: `Lap #${lapA.lapCounter}`, data: ptsSpeedA, borderColor: '#00d4a8', borderWidth: 1.5, pointRadius: 0, tension: 0.2 },
                    { label: `Lap #${lapB.lapCounter}`, data: ptsSpeedB, borderColor: '#007a61', borderWidth: 1.5, borderDash: [5,4], pointRadius: 0, tension: 0.2 }
                ]);

                chartCmpCur = renderCompareChart('ch-cmp-cur', 'CURRENT COMPARISON', 'Current (A)', [
                    { label: `Lap #${lapA.lapCounter}`, data: ptsCurA, borderColor: '#f04060', borderWidth: 1.5, pointRadius: 0, tension: 0.2 },
                    { label: `Lap #${lapB.lapCounter}`, data: ptsCurB, borderColor: '#8a2537', borderWidth: 1.5, borderDash: [5,4], pointRadius: 0, tension: 0.2 }
                ]);

                chartCmpThr = renderCompareChart('ch-cmp-thr', 'THROTTLE COMPARISON', 'Throttle (%)', [
                    { label: `Lap #${lapA.lapCounter}`, data: ptsThrA, borderColor: '#f5a623', borderWidth: 1.5, pointRadius: 0, tension: 0.2 },
                    { label: `Lap #${lapB.lapCounter}`, data: ptsThrB, borderColor: '#b57710', borderWidth: 1.5, borderDash: [5,4], pointRadius: 0, tension: 0.2 }
                ]);

                // Isi panel info terbelah (kiri kanan)
                document.getElementById('lap-info-a').innerHTML = getLapInfoHTML(lapA, '#00d4a8');
                document.getElementById('lap-info-b').innerHTML = getLapInfoHTML(lapB, '#007a61');
                
                return;
            } 
            
            // KONDISI TAB STANDAR
            const data = getVisibleData();
            if (!data.length) { ntc.classList.add('show'); return; }

            const step = Math.max(1, Math.floor(data.length / 3000));
            sampled = data.filter((_, i) => i % step === 0);
            const xLbl = sampled.map(d => { const s = d.millis / 1000; return `${Math.floor(s/60)}:${(s%60).toFixed(0).padStart(2,'0')}`; });
            const sets = [], scl = { x:{ticks:{color:'#2a4060', font:{size:9}, maxRotation:0}, grid:{color:'#0d1620'}}, yL:{type:'linear', position:'left', ticks:{color:'#2a4060', font:{size:9}}, grid:{color:'#0d1620'}}, yR:{type:'linear', position:'right', ticks:{color:'#2a4060', font:{size:9}}, grid:{drawOnChartArea:false}} };

            if (m === 'overview') {
                sets.push({ label: 'Speed', yAxisID: 'yL', data: sampled.map(d => d.speed), borderColor: '#00d4a8', borderWidth: 1.5, pointRadius: 0 });
                sets.push({ label: 'Current', yAxisID: 'yL', data: sampled.map(d => d.current), borderColor: '#f04060', borderWidth: 1.5, pointRadius: 0 });
                sets.push({ label: 'Throttle', yAxisID: 'yR', data: sampled.map(d => d.throttle), borderColor: '#f5a623', borderWidth: 1.5, pointRadius: 0 });
            }
            else if (m === 'electric') {
                sets.push({ label: 'Current', yAxisID: 'yL', data: sampled.map(d => d.current), borderColor: '#3b91f7', borderWidth: 1.5, pointRadius: 0 });
                sets.push({ label: 'Voltage', yAxisID: 'yR', data: sampled.map(d => d.voltage), borderColor: '#a37af4', borderWidth: 1.5, pointRadius: 0 });
            }

            chart = new Chart(cvs, { type: 'line', data: { labels: xLbl, datasets: sets },
                plugins: [{
                    id: 'tracker', afterDraw(c) {
                        if (state.chartMode === 'compare') return;
                        const m = c.getDatasetMeta(0); if (!m || !m.data.length) return;
                        let si = -1; for (let i = 0; i < sampled.length; i++) { if (data.indexOf(sampled[i]) >= state.ridx) { si = i; break; } }
                        if (si < 0) si = sampled.length - 1;
                        if (si >= 0 && si < m.data.length) {
                            const ctx = c.ctx, x = m.data[si].x, top = c.chartArea.top, bot = c.chartArea.bottom;
                            ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1; ctx.setLineDash([4,3]);
                            ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bot); ctx.stroke(); ctx.restore();
                        }
                    }
                }],
                options: { animation: false, responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { labels: { color: '#4e6685', font: { size: 10 } }, position: 'top' } }, scales: scl }
            });
        }

        function exportWeb() {
            if (!state.telemetry || !state.telemetry.length) return alert('Tidak ada data yang bisa diekspor!');
            const doc = document.implementation.createHTMLDocument("Telemetry Standalone");
            doc.documentElement.innerHTML = document.documentElement.innerHTML;
            const mapWrap = doc.getElementById('map-wrap');
            if (mapWrap) {
                mapWrap.innerHTML = `
                    <div id="map"></div>
                    <div id="map-ctrl">
                        <button class="m-btn on" id="btn-thr" onclick="toggleLayer('thr',this)">Throttle</button>
                        <button class="m-btn on" id="btn-route" onclick="toggleLayer('route',this)">Route</button>
                    </div>
                    <div id="leg">
                        <div class="leg-title">Throttle</div>
                        <div class="leg-bar"></div>
                        <div class="leg-labels"><span>0%</span><span>100%</span></div>
                    </div>
                    <div id="map-empty" style="display:none;"></div>
                `;
            }
            const chArea = doc.getElementById('ch-area');
            if (chArea) chArea.innerHTML = `
                <div id="ch-single" style="width: 100%; height: 200px; position: relative;"><canvas id="ch"></canvas></div>
                <div id="ch-compare" style="display: none; width: 100%; flex-direction: column; gap: 16px;">
                    <div class="ch-cmp-box" style="height: 200px; position: relative;"><canvas id="ch-cmp-speed"></canvas></div>
                    <div class="ch-cmp-box" style="height: 200px; position: relative;"><canvas id="ch-cmp-cur"></canvas></div>
                    <div class="ch-cmp-box" style="height: 200px; position: relative;"><canvas id="ch-cmp-thr"></canvas></div>
                </div>
                <div id="ch-notice"></div>`;

            doc.querySelectorAll('.leaflet-style').forEach(e => e.remove());
            
            const btnUpload = doc.getElementById('btn-upload'); if (btnUpload) btnUpload.style.display = 'none';
            const btnExport = doc.getElementById('btn-export'); if (btnExport) btnExport.style.display = 'none';
            
            const dataScript = doc.createElement('script');
            dataScript.textContent = `window.PRELOADED_DATA = ${JSON.stringify(state.telemetry)};`;
            doc.head.appendChild(dataScript);

            const htmlContent = "<!DOCTYPE html>\n<html lang=\"id\">\n" + doc.documentElement.innerHTML + "\n</html>";
            const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `Telemetry_Web_${new Date().getTime()}.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        async function loadFiles(files) {
            let dataRows = null;
            for (const f of files) {
                if (f.name.endsWith('.xlsx')) {
                    const b = await f.arrayBuffer(), w = XLSX.read(b, { type: 'array' }), r = XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]], { header: 1 });
                    if (r.length) dataRows = (r[0].length === 1 && typeof r[0][0] === 'string' && r[0][0].includes(',')) ? r.map(x => x[0].split(',')) : r;
                } else if (f.name.endsWith('.csv')) {
                    const p = Papa.parse(await f.text(), { header: false, skipEmptyLines: true });
                    if (p.data.length) dataRows = p.data;
                } if (dataRows) break;
            }
            if (!dataRows) return alert('File kosong / format tidak sesuai.');

            try {
                let tele = parseDataArray(dataRows);
                
                let cumDist = 0;
                for (let i = 0; i < tele.length; i++) {
                    if (i > 0) {
                        const lat1 = tele[i-1].lat * Math.PI/180;
                        const lat2 = tele[i].lat * Math.PI/180;
                        const dLng = (tele[i].lng - tele[i-1].lng) * Math.PI/180;
                        const a = Math.sin((lat2-lat1)/2)**2 + Math.cos(lat1)*Math.cos(lat2) * Math.sin(dLng/2)**2;
                        cumDist += 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                    }
                    tele[i].distance = cumDist;
                }

                let mc = 0; for (const d of tele) if (Math.abs(d.current) > mc) mc = Math.abs(d.current);
                if (mc > 300) for (const d of tele) d.current /= 1000;
                
                state.telemetry = tele; 
                state.laps = detectLaps(tele);
                
                document.getElementById('btn-export').style.display = 'inline-block';
                goToLap(-1); hideUpload();
            } catch (err) { alert('Error: ' + err.message); }
        }

        initMap(); 
        
        if (window.PRELOADED_DATA) {
            state.telemetry = window.PRELOADED_DATA;
            state.laps = detectLaps(state.telemetry);
            document.getElementById('btn-upload').style.display = 'none';
            document.getElementById('btn-export').style.display = 'none';
            goToLap(-1);
        } else {
            setTimeout(showUpload, 400);
        }
        
        window.prevLap = () => goToLap(state.currentLapIdx - 1);
        window.nextLap = () => goToLap(state.currentLapIdx + 1);
        window.resetLapView = () => goToLap(-1);
    </script>
</body>
